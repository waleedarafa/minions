[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minions"
version = "0.1.0"
description = "Open-source autonomous coding agents inspired by Stripe's Minions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "litellm>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.12.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "docker>=7.0.0",
    "gitpython>=3.1.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]
slack = [
    "slack-bolt>=1.20.0",
]

[project.scripts]
minion = "src.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
