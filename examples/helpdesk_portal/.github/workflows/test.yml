name: Tests

on:
  push:
    branches: [main, "minion/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest -xvs tests/
      - run: ruff check src tests
