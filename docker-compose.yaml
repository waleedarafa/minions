version: "3.9"

services:
  minion-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - MINIONS_SERVER_ROLE=api
      - MINIONS_API_STATE_PATH=/app/.minion/state/api-state.db
      - MINIONS_API_STATE_BACKEND=sqlite
    command: python -m src.cli.main serve-api --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - minion_state:/app/.minion/state

  minion-worker:
    build: .
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - MINIONS_SERVER_ROLE=worker
      - MINIONS_WORKER_ID=minion-worker-1
      - MINIONS_API_STATE_PATH=/app/.minion/state/api-state.db
      - MINIONS_API_STATE_BACKEND=sqlite
    command: python -m src.cli.main worker --host 0.0.0.0 --port 8000
    depends_on:
      - minion-api
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - minion_state:/app/.minion/state

volumes:
  minion_state:
