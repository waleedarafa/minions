name: implement_feature
description: "Implement a new feature, verify it, then open a PR"
max_tokens: 200000
max_wall_clock_seconds: 900

steps:
  - name: hydrate_context
    type: deterministic
    action: load_rules_and_tools

  - name: create_branch
    type: deterministic
    action: git_create_branch

  - name: plan
    type: agentic
    prompt: |
      Explore the codebase and produce a detailed implementation plan for the requested feature.
      Do NOT write any code yet — planning only.
      Your plan must include:
      1. Files to create (with purpose of each)
      2. Files to modify (with what changes and why)
      3. Key functions/classes to add
      4. Edge cases and error handling to consider
      5. How the new code integrates with existing code
      Output the plan as a structured markdown document.
    tools: [read_file, list_files, grep_search]
    max_iterations: 10

  - name: implement
    type: agentic
    prompt: |
      Implement the requested feature by following the plan provided below.
      - Create new files or edit existing ones as needed using create_file and edit_file.
      - Follow the existing code style and conventions.
      - Do not run the code — a separate verification step will do that after you are done.
      - When done, provide a brief summary of all files created or modified.
    tools: [read_file, edit_file, create_file, list_files, grep_search]
    max_iterations: 30

  - name: run_linter
    type: deterministic
    action: run_linters
    timeout: 30s

  - name: verify
    type: deterministic
    action: run_tests
    timeout: 60s

  - name: prepare_fix
    type: deterministic
    condition: ci_failed
    action: mark_fix_attempted

  - name: fix_failures
    type: agentic
    condition: ci_failed
    prompt: |
      The verification steps failed. Review the output below and fix the issues.
      Use run_command to investigate further if needed.
    tools: [read_file, edit_file, run_command, grep_search]
    max_iterations: 20

  - name: reset_for_reverify
    type: deterministic
    condition: fix_attempted
    action: reset_ci_status

  - name: re_lint
    type: deterministic
    condition: fix_attempted
    action: run_linters
    timeout: 30s

  - name: re_verify
    type: deterministic
    condition: fix_attempted
    action: run_tests
    timeout: 60s

  - name: commit_and_push
    type: deterministic
    condition: not_ci_failed
    action: git_commit_and_push

  - name: open_pr
    type: deterministic
    condition: not_ci_failed
    action: create_pull_request
